# LEGACY TEMPORAIRE — chiropraxie-guinee.fr
# À inclure dans la config Traefik/Nginx du serveur (ex. via include ou labels).
# Suppression : rm ce fichier + retirer l'include dans la config principale.
# ─────────────────────────────────────────────────────────────────────────────

# Option A — Bloc server Nginx dédié (frontend Sylisante déjà déployé)
server {
    listen 80;
    server_name chiropraxie-guinee.fr www.chiropraxie-guinee.fr;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # API backend Sylisante (formulaire de contact)
    location /api/ {
        set $backend_upstream sylisante-backend:8080;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Racine du domaine → landing Angular (URL visible /chiropraxie)
    location = / {
        return 302 /chiropraxie;
    }

    # SPA Angular (route /chiropraxie + assets)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

